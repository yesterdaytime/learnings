<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <body>
        <div>
            <div className="h-full w-full">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
                    <defs>
                        <path
                            id="path"
                            d="M50 200 C150 50 250 350 400 200 C500 50 650 350 750 200"
                            stroke="#fff"
                            fill="none"
                        ></path>
                    </defs>
                    <text fill="#000">
                        <textPath id="text" ref="{textRef}" xlink:href="#path">
                            Flowing
                            <tspan fill="#e74c3c">wave</tspan>
                            motion is a compact design!
                        </textPath>
                    </text>
                </svg>

                <button id="animate-btn" onClick="{animateText}">
                    let's animate!
                </button>
            </div>
        </div>
        <script
            id="animate"
            src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.7/gsap.min.js"
        ></script>
        <script>
            const dur = 2.5;
            const tl = gsap.timeline();
            document
                .querySelector('#animate-btn')
                .addEventListener('click', animateText);

            tl.from(
                '#text',
                dur,
                {
                    attr: { startOffset: '100%' },
                    ease: 'power1',
                },
                {
                    attr: { startOffset: '0' },
                    ease: 'power1',
                }
            );

            tl.reversed(true);

            function animateText() {
                tl.reversed(!tl.reversed);
            }
        </script>
    </body>
</html>
