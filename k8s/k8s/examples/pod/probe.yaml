apiVersion: v1
kind: Pod
metadata:
    name: probe-example
spec:
    containers:
        - name: app
          image: nginx
          ports:
              - containerPort: 80
          startupProbe:
              httpGet:
                  path: /
                  port: 80
              failureThreshold: 30
              periodSeconds: 10
          livenessProbe:
              httpGet:
                  path: /
                  port: 80
              initialDelaySeconds: 10
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 3
          readinessProbe:
              httpGet:
                  path: /
                  port: 80
              periodSeconds: 5
